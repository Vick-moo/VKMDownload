<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    :root { color-scheme: dark; }
    body {
      width: 264px;
      margin: 0;
      padding: 14px;
      background: #0d0f14;
      color: #e6e9f0;
      font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
    }
    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .head img { width: 22px; height: 22px; }
    .head strong { font-size: 14px; }
    .state {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 11px; margin-bottom: 12px;
      border-radius: 8px; background: #14171f;
      border: 1px solid #262c3a; font-size: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
    .dot--on { background: #3ecf8e; box-shadow: 0 0 6px #3ecf8e; }
    .dot--off { background: #d9534f; }
    button {
      width: 100%; padding: 9px; border-radius: 8px; cursor: pointer;
      border: 1px solid #4c8dff; background: transparent;
      color: #7ba9ff; font: inherit; font-weight: 600;
    }
    button:hover { background: rgba(76, 141, 255, 0.14); }
    .pair { display: flex; gap: 6px; margin-top: 10px; }
    .pair input {
      flex: 1; min-width: 0; padding: 7px 9px; border-radius: 8px;
      border: 1px solid #262c3a; background: #14171f;
      color: #e6e9f0; font: inherit; font-size: 12px;
    }
    .pair button { width: auto; padding: 7px 12px; white-space: nowrap; }
    .hint { margin: 10px 0 0; font-size: 11px; color: #7c8699; }
  </style>
</head>
<body>
  <div class="head">
    <img src="icons/icon32.png" alt="" />
    <strong>VKMDownload</strong>
  </div>

  <div class="state">
    <span class="dot" id="dot"></span>
    <span id="state">正在检查…</span>
  </div>

  <button id="toggle" type="button">…</button>

  <div class="pair">
    <input id="token" type="password" placeholder="配对 token（App 设置→浏览器配对）" autocomplete="off" />
    <button id="saveToken" type="button">保存</button>
  </div>

  <p class="hint" id="hint"></p>

  <script src="popup.js"></script>
</body>
</html>
